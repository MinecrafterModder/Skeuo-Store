<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      header {
        color: #C8C8C8;
        text-shadow: 0px -1px #000000;
        font-family: "Helvetica Neue", Helvetica;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: linear-gradient(to bottom, #545454, #414141, #2A2B2A, #171617);
        height: 44px;
        box-shadow: 0px 2px 2px #00000033;
        position: relative;
      }
      .white {
        color: #4D4D4D;
        text-decoration: none;
        font-family: "Helvetica Neue", Helvetica;
        background-color: #F5F5F5;
        height: 90px;
        display: flex;
        align-items: center;
        gap: 35px;
        box-shadow: inset 0px 1px #FFFFFF, inset 0px -1px #0000001A;
      }
      .index {
        margin-left: 30px;
        color: #ACACAC;
        text-shadow: 0px 1px #FFFFFF;
        font-size: 17px;
      }
      .gray {
        color: #4D4D4D;
        text-decoration: none;
        font-family: "Helvetica Neue", Helvetica;
        background-color: #EBEBEB;
        height: 90px;
        display: flex;
        align-items: center;
        gap: 35px;
        box-shadow: inset 0px 1px #FFFFFF, inset 0px -1px #0000001A;
      }
      .white img {
        border-radius: 11px;
        width: 64px;
        height: 64px;
        box-shadow: 0px 1px 1px #000000BF;
      }
      .gray img {
        border-radius: 11px;
        width: 64px;
        height: 64px;
        box-shadow: 0px 1px 1px #000000BF;
      }
      span {
        margin-left: -20px;
        color: #4D4D4D;
        text-shadow: 0px 1px #FFFFFF;
        font-size: 14px;
      }
      .button {
        margin-left: auto;
        margin-right: 15px;
        border-radius: 3px;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 55px;
        height: 25px;
        background-image: linear-gradient(to bottom, #EFEFEF, #DBDBDB);
        outline: 1px solid #00000033;
      }
    </style>
  </head>
  <body>
    <header>Skeuomorphic iPhone Apps</header>
    <a class="white" href="https://apps.apple.com/app/medley-music-player/id1643761346" target="_blank"> <span class="index" >1</span> <img src="assets/medley-music-player.png"> <span>Medley Music Player</span> <span class="button">$2.99</span> </a>
    <a class="gray" href="https://apps.apple.com/app/skeuobooks/id6752832389" target="_blank"> <span class="index" >2</span> <img src="assets/skeuobooks.png"> <span>SkeuoBooks</span> <span class="button">$1.99</span> </a>
    <a class="white" href="https://apps.apple.com/app/skeuonotes/id6747936693" target="_blank"> <span class="index" >3</span> <img src="assets/skeuonotes.png"> <span>SkeuoNotes</span> <span class="button">$1.99</span> </a>
    <a class="gray" href="https://apps.apple.com/app/papertone/id6746156771" target="_blank"> <span class="index" >4</span> <img src="assets/papertone.png"> <span>Papertone</span> <span class="button">$1.99</span> </a>
  </body>
</html>
